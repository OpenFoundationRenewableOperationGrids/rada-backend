# Lint only: the existing code isn't formatted with `ruff format`.
target-version = "py311"

[lint]
# Ruff's classic defaults: syntax errors, undefined names, unused imports...
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Sets the test environment variables before importing the app
"tests/conftest.py" = ["E402"]
