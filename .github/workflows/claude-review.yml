name: Claude review

# On-demand code review: a maintainer comments "@claude review" on a pull
# request once it is ready. Nothing runs when a PR is opened or pushed to.
#
# issue_comment workflows always run from the default branch (develop), never
# from the PR's own code, so a pull request cannot alter this workflow.
on:
  issue_comment:
    types: [created]

# One review at a time per pull request; a new request waits for the current one
concurrency:
  group: claude-review-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    name: Claude review
    # Only top-level comments on a pull request (not an issue) starting with the command
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      startsWith(github.event.comment.body, '@claude review')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      # Required by claude-code-action to authenticate as the Claude GitHub App,
      # which posts the inline comments
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # The action rejects commenters without write access to the repository,
      # so external contributors cannot start a review (and spend the quota)
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.issue.number }}"
          # Pinned model: reviews always use Opus 5.5, whatever the default
          # model is or which model wrote the code
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --append-system-prompt "Before reviewing, read REVIEW.md at the repository root and follow its rules on severity, what to skip and what to always check."
