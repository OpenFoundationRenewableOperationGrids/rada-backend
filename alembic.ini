# Alembic configuration. See docs/MIGRATIONS.md for how to create and apply
# migrations.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
# Files are named <rev>_<slug>.py. Pass --rev-id (0002, 0003...) to
# `alembic revision` so they list in order; without it the rev is a random hash.
file_template = %%(rev)s_%%(slug)s
# No sqlalchemy.url here: env.py takes it from DATABASE_URL via database.py.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
